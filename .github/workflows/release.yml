name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    # 0.3.1 finished in under two minutes, but that was amd64 only. The emulated
    # arm64 build compiles native modules from source, so the ceiling is raised
    # to leave real headroom rather than have a release fail at the last step.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - run: npm ci
      - run: npm run build -w @drakon-systems/ekho-sdk
      - run: npm run typecheck
      - run: npx vitest run

      # Publish SDK to npm (if NPM_TOKEN is set)
      - name: Publish @drakon-systems/ekho-sdk to npm
        run: npm publish -w @drakon-systems/ekho-sdk --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        continue-on-error: true

      # The agent-side plugin. Until 0.3.0 this had no release path at all: it was
      # copied onto each machine by hand and patched in place, so every box
      # reported 0.2.1 regardless of the code it was actually running.
      #
      # Deliberately NOT continue-on-error. A silently skipped publish is the
      # failure mode that hid the private container image for three releases —
      # a release that cannot ship the plugin should fail loudly and be re-cut.
      - name: Build the OpenClaw plugin
        run: npm run build -w @drakon-systems/ekho-openclaw-plugin

      - name: Publish @drakon-systems/ekho-openclaw-plugin to npm
        run: npm publish -w @drakon-systems/ekho-openclaw-plugin --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Build and publish the relay container image to GHCR
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Required to cross-build the arm64 image on an amd64 runner.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # GHCR / Docker require lowercase repository names; the org slug is mixed-case.
      - name: Compute lowercase image name
        id: img
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Docker image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.img.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref, '-') }}

      # Through 0.3.1 this built only for the runner's own architecture, so the
      # published image was amd64-only. Ekho targets Tailscale meshes, homelabs
      # and edge nodes — Raspberry Pis, Apple Silicon, Oracle's ARM free tier —
      # where arm64 is the common case, not the exception. Our own relay host is
      # aarch64 and could not have run the image we were publishing.
      #
      # arm64 is cross-built under QEMU, which is slow here: the Dockerfile
      # compiles better-sqlite3 from source in both stages. Hence the raised
      # job timeout below. If this proves too slow or flaky, the better fix is
      # a native ARM runner building in parallel and a merged manifest.
      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Create GitHub Release
      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: "Ekho v${{ steps.version.outputs.VERSION }}"
          body: |
            ## Ekho v${{ steps.version.outputs.VERSION }}

            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.

            ### Quick Start
            ```bash
            # npm
            npm install @drakon-systems/ekho-sdk

            # Docker
            docker pull ${{ steps.img.outputs.name }}:${{ steps.version.outputs.VERSION }}

            # From source
            git clone https://github.com/${{ github.repository }}.git
            cd ekho && npm install && npm run build && npm start
            ```
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}
          generate_release_notes: true
