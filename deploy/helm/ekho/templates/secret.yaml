{{- if not .Values.secrets.existingSecret -}}
{{- if not .Values.secrets.operatorSessionSecret -}}
{{- fail "secrets.operatorSessionSecret is required. Generate one with: openssl rand -hex 32 and pass via --set secrets.operatorSessionSecret=... or a values file." -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ekho.secretName" . }}
  labels:
    {{- include "ekho.labels" . | nindent 4 }}
type: Opaque
stringData:
  EKHO_OPERATOR_SESSION_SECRET: {{ .Values.secrets.operatorSessionSecret | quote }}
  {{- if .Values.secrets.licenseKey }}
  EKHO_LICENSE_KEY: {{ .Values.secrets.licenseKey | quote }}
  {{- end }}
{{- end -}}
