{{/*
  StatefulSet — Ekho uses SQLite, which requires a single writer against a
  stable PersistentVolume. A StatefulSet gives us:
    * one pod with a stable name (ekho-0)
    * a dedicated PVC bound to that pod via volumeClaimTemplates
    * ordered, serial rollouts (no two pods writing the DB at once)
  Do NOT convert this to a Deployment unless the storage backend changes.
*/}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "ekho.fullname" . }}
  labels:
    {{- include "ekho.labels" . | nindent 4 }}
spec:
  # Single writer only — see values.yaml replicaCount comment.
  replicas: {{ .Values.replicaCount }}
  serviceName: {{ include "ekho.fullname" . }}
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: {{ .Values.updateStrategy.type }}
  selector:
    matchLabels:
      {{- include "ekho.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ekho.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        # Roll the pod when the ConfigMap or Secret changes.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ include "ekho.serviceAccountName" . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: relay
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 4000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "ekho.configMapName" . }}
          env:
            - name: EKHO_OPERATOR_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "ekho.secretName" . }}
                  key: EKHO_OPERATOR_SESSION_SECRET
            {{- if or .Values.secrets.licenseKey .Values.secrets.existingSecret }}
            - name: EKHO_LICENSE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "ekho.secretName" . }}
                  key: EKHO_LICENSE_KEY
                  optional: true
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /app/data
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if not .Values.persistence.enabled }}
      volumes:
        # persistence.enabled=false — SQLite DB lives in an emptyDir and is
        # LOST on pod restart. Acceptable for dev/testing only.
        - name: data
          emptyDir: {}
      {{- end }}
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "ekho.labels" . | nindent 10 }}
        {{- with .Values.persistence.annotations }}
        annotations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      spec:
        accessModes:
          {{- toYaml .Values.persistence.accessModes | nindent 10 }}
        {{- if .Values.persistence.storageClass }}
        {{- if (eq "-" .Values.persistence.storageClass) }}
        storageClassName: ""
        {{- else }}
        storageClassName: {{ .Values.persistence.storageClass | quote }}
        {{- end }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size | quote }}
  {{- end }}
