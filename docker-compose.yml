services:
  relay:
    build: .
    ports:
      - "4000:4000"
    environment:
      - EKHO_HOST=0.0.0.0
      - EKHO_OPERATOR_SESSION_SECRET=${EKHO_OPERATOR_SESSION_SECRET:-change-me}
    volumes:
      - ekho-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  ekho-data:
