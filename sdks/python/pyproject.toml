[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ekho-sdk"
version = "0.1.0"
description = "Python SDK for Ekho — signed, store-and-forward messaging for AI agent fleets."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Drakon Systems", email = "support@drakonsystems.com" }
]
keywords = ["ekho", "agent", "messaging", "hmac", "a2a", "fleet"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Networking",
]
dependencies = [
    "requests>=2.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.urls]
Homepage = "https://github.com/Drakon-Systems-Ltd/ekho"
Repository = "https://github.com/Drakon-Systems-Ltd/ekho"
Issues = "https://github.com/Drakon-Systems-Ltd/ekho/issues"

[tool.setuptools.packages.find]
include = ["ekho*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
