openapi: 3.1.0
info:
  title: Ekho Relay API
  version: 0.5.1
  description: >
    Multi-agent relay service providing message routing, policy enforcement,
    approval workflows, rate limiting, and fleet management for AI agent systems.
  contact:
    name: Ekho
  license:
    name: Proprietary

servers:
  - url: http://127.0.0.1:4000
    description: Local development relay

tags:
  - name: System
    description: Health and service metadata
  - name: Agent
    description: Agent enrollment, messaging, heartbeats, and action proposals
  - name: Operator
    description: Fleet management, approvals, policies, and observability

security: []

components:
  securitySchemes:
    AgentHMAC:
      type: apiKey
      in: header
      name: x-ekho-signature
      description: >
        HMAC-SHA256 signature authentication for enrolled agents. Requires five
        headers sent together: `x-ekho-agent-id` (agent UUID), `x-ekho-agent-secret`,
        `x-ekho-timestamp` (ISO 8601), `x-ekho-nonce` (UUID v4), and
        `x-ekho-signature` (HMAC-SHA256 of `METHOD\nPATH\nTIMESTAMP\nNONCE\nSHA256(body)`).

    OperatorBearer:
      type: http
      scheme: bearer
      description: >
        Bearer token obtained from `POST /v1/operator/login`. Pass as
        `Authorization: Bearer <token>`.

  schemas:
    # --- Primitives & enums ---

    AgentId:
      type: string
      description: Unique agent identifier (UUID).
      example: ag_01HXYZ

    FleetId:
      type: string
      description: Unique fleet identifier.
      example: fl_01HXYZ

    ConversationId:
      type: string
      minLength: 1
      description: Conversation thread identifier.

    CorrelationId:
      type: string
      minLength: 1
      description: Correlation identifier for distributed tracing.

    MessageType:
      type: string
      enum: [direct, broadcast, alert, handoff, claim, complete, heartbeat, control]

    Priority:
      type: string
      enum: [low, normal, high, urgent]
      default: normal

    RiskLevel:
      type: string
      enum: [low, medium, high, critical]

    AgentStatus:
      type: string
      enum: [active, paused, quarantined, revoked]

    HeartbeatStatus:
      type: string
      enum: [healthy, degraded, busy, idle]

    AgentRuntime:
      type: string
      enum: [custom, openclaw, langgraph, autogen]

    ActionResult:
      type: string
      enum: [executed, cancelled, failed]

    ApprovalStatus:
      type: string
      enum: [pending_approval, approved, rejected, executed, cancelled, failed]

    ScopeKind:
      type: string
      enum: [fleet, agent]

    PolicyAction:
      type: string
      enum: [allow, deny]

    AgentAction:
      type: string
      enum: [pause, resume, quarantine]

    ApprovalDecision:
      type: string
      enum: [approve, reject]

    # --- Request / response objects ---

    Recipient:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [agent, group, broadcast]
        id:
          type: string
          minLength: 1
          description: Required unless kind is `broadcast`.
      description: >
        Message target. `id` is required for `agent` and `group` kinds.

    EnrollRequest:
      type: object
      required: [fleet_id, token, display_name, runtime]
      properties:
        fleet_id:
          $ref: "#/components/schemas/FleetId"
        token:
          type: string
          minLength: 1
          description: One-time enrollment token issued by an operator.
        display_name:
          type: string
          minLength: 1
        runtime:
          $ref: "#/components/schemas/AgentRuntime"
        hostname:
          type: string
        capabilities:
          type: array
          items:
            type: string
          default: []

    EnrollResponse:
      type: object
      required: [agent_id, secret, relay_base_url, heartbeat_interval_seconds, poll_interval_seconds, policy_profile]
      properties:
        agent_id:
          $ref: "#/components/schemas/AgentId"
        secret:
          type: string
          description: HMAC secret. Store securely — shown only once.
        relay_base_url:
          type: string
          format: uri
        heartbeat_interval_seconds:
          type: integer
        poll_interval_seconds:
          type: integer
        policy_profile:
          type: string

    SendMessageRequest:
      type: object
      required: [recipient, message_type, body, conversation_id, correlation_id]
      properties:
        recipient:
          $ref: "#/components/schemas/Recipient"
        message_type:
          $ref: "#/components/schemas/MessageType"
        priority:
          $ref: "#/components/schemas/Priority"
        ttl_seconds:
          type: integer
          minimum: 1
          maximum: 86400
          default: 900
        requires_approval:
          type: boolean
          default: false
        body:
          type: object
          additionalProperties: true
        metadata:
          type: object
          additionalProperties: true
        conversation_id:
          $ref: "#/components/schemas/ConversationId"
        correlation_id:
          $ref: "#/components/schemas/CorrelationId"

    SendMessageResponse:
      type: object
      required: [message_id, status, queued_at]
      properties:
        message_id:
          type: string
        status:
          type: string
          example: queued
        queued_at:
          type: string
          format: date-time

    InboxMessage:
      type: object
      properties:
        message_id:
          type: string
        conversation_id:
          $ref: "#/components/schemas/ConversationId"
        correlation_id:
          $ref: "#/components/schemas/CorrelationId"
        sender_agent_id:
          $ref: "#/components/schemas/AgentId"
        message_type:
          $ref: "#/components/schemas/MessageType"
        priority:
          $ref: "#/components/schemas/Priority"
        body:
          type: object
          additionalProperties: true
        metadata:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        deadline_at:
          type: string
          format: date-time

    ControlAction:
      type: object
      properties:
        control_id:
          type: string
        action:
          type: string
        reason:
          type: string

    InboxResponse:
      type: object
      required: [messages, controls]
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/InboxMessage"
        controls:
          type: array
          items:
            $ref: "#/components/schemas/ControlAction"
        peer_autoreply:
          type: boolean
          description: Operator-controlled peer auto-reply for this agent (live).
        peer_turn_budget:
          type: [integer, "null"]
          minimum: 1
          description: >
            Optional operator-set cap on how many times a teammate may wake this
            agent per conversation. `null` means NO LIMIT, which is the default —
            a limit exists only when the operator sets one. Agent plugins older
            than this change read `null` as "use my local default" (25 there).
        conversation_budgets:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
          description: >
            Project-mode rooms this agent belongs to, keyed by conversation id.
            The room's value overrides `peer_turn_budget` in that conversation: a
            positive integer is the room's cap, `0` means the room has no limit.
            Values stay numeric for compatibility (older plugins read a
            non-positive entry as "no override").

    TurnBudgetInput:
      type: [integer, "null"]
      minimum: 0
      description: >
        Optional turn limit. A positive integer sets a cap; `0` or `null` clears
        it (no limit — the default). Omit the field to leave the current value
        untouched. Negative or non-integer values are rejected with 400.

    PeerAutoreplyRequest:
      type: object
      required: [autoreply]
      properties:
        autoreply:
          type: boolean
        budget:
          allOf:
            - $ref: "#/components/schemas/TurnBudgetInput"
          maximum: 200

    PeerAutoreplyResponse:
      type: object
      required: [agent_id, peer_autoreply, peer_turn_budget]
      properties:
        agent_id:
          type: string
        peer_autoreply:
          type: boolean
        peer_turn_budget:
          type: [integer, "null"]
          minimum: 1
          maximum: 200
          description: The cap now in force, or `null` for no limit.

    ProjectModeRequest:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
        budget:
          allOf:
            - $ref: "#/components/schemas/TurnBudgetInput"
          maximum: 500

    ProjectModeResponse:
      type: object
      required: [room_id, project_mode, project_turn_budget]
      properties:
        room_id:
          type: string
        project_mode:
          type: boolean
        project_turn_budget:
          type: [integer, "null"]
          minimum: 1
          maximum: 500
          description: The room's cap, or `null` for no limit.

    MessageRecipient:
      type: object
      required: [kind, id]
      properties:
        kind:
          type: string
          enum: [agent, group, broadcast]
        id:
          type: string
          nullable: true
          description: Null for a broadcast.

    MessageDeliveryStatus:
      type: object
      description: >
        The relay's per-recipient view of one delivery. This — not the
        message-level `status` — is the honest answer to "did it land?", because
        a broadcast or room fan-out has one row per recipient and they progress
        independently.
      required: [recipient_agent_id, status]
      properties:
        recipient_agent_id:
          $ref: "#/components/schemas/AgentId"
        status:
          type: string
          enum: [queued, delivered, acked, dead_lettered, expired]
          description: >
            `queued` — accepted and waiting to be collected. `delivered` — handed
            to the recipient's `/v1/inbox` poll. `acked` — the recipient
            confirmed receipt. `dead_lettered` — retries exhausted, it will never
            be delivered. `expired` — the TTL elapsed before collection.
        queued_at:
          type: string
          format: date-time
          nullable: true
        delivered_at:
          type: string
          format: date-time
          nullable: true
          description: >
            When the recipient last collected it. The retry sweep CLEARS this
            when it requeues a delivered-but-unacked delivery, so an `acked`
            delivery can legitimately show `delivered_at: null` with
            `retry_count > 0` — read `delivery_attempts` and `last_failure_reason`
            for the fuller picture.
        acked_at:
          type: string
          format: date-time
          nullable: true
        delivery_attempts:
          type: integer
        retry_count:
          type: integer
        last_failure_reason:
          type: string
          nullable: true
        dead_lettered_at:
          type: string
          format: date-time
          nullable: true
        dead_letter_reason:
          type: string
          nullable: true
          example: max_retries_exceeded

    MessageStatusResponse:
      type: object
      required: [message_id, conversation_id, status, created_at, expires_at, expired, deliveries]
      properties:
        message_id:
          type: string
        conversation_id:
          $ref: "#/components/schemas/ConversationId"
        correlation_id:
          $ref: "#/components/schemas/CorrelationId"
        message_type:
          $ref: "#/components/schemas/MessageType"
        priority:
          $ref: "#/components/schemas/Priority"
        recipient:
          $ref: "#/components/schemas/MessageRecipient"
        status:
          type: string
          enum: [queued, acked, dead_lettered, expired]
          description: >
            The message-level roll-up. It only reaches `acked` once EVERY
            recipient has acked, so read `deliveries` for the per-recipient
            truth.
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        expired:
          type: boolean
          description: >
            `expires_at` is in the past. A still-`queued` expired message is the
            one "dropped" outcome that leaves no dead letter behind — `/v1/inbox`
            will never serve it.
        deliveries:
          type: array
          items:
            $ref: "#/components/schemas/MessageDeliveryStatus"

    AgentConversation:
      type: object
      required: [conversation_id, kind, message_count, sent_count]
      properties:
        conversation_id:
          $ref: "#/components/schemas/ConversationId"
        kind:
          type: string
          enum: [room, direct]
        name:
          type: string
          nullable: true
          description: The room's name; null for a direct conversation.
        message_count:
          type: integer
          description: Total messages in the thread, from any sender.
        sent_count:
          type: integer
          description: How many of them this agent sent (across ALL of its sessions).
        last_message_at:
          type: string
          format: date-time
          nullable: true
        last_activity_at:
          type: string
          format: date-time
          nullable: true
          description: >
            `last_message_at`, or the room's creation time for a room nobody has
            posted in yet.

    AgentConversationsResponse:
      type: object
      required: [conversations]
      properties:
        conversations:
          type: array
          items:
            $ref: "#/components/schemas/AgentConversation"

    SentMessage:
      type: object
      required: [message_id, conversation_id, status, created_at, deliveries]
      properties:
        message_id:
          type: string
        conversation_id:
          $ref: "#/components/schemas/ConversationId"
        correlation_id:
          $ref: "#/components/schemas/CorrelationId"
        message_type:
          $ref: "#/components/schemas/MessageType"
        priority:
          $ref: "#/components/schemas/Priority"
        recipient:
          $ref: "#/components/schemas/MessageRecipient"
        status:
          type: string
          enum: [queued, acked, dead_lettered, expired]
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        expired:
          type: boolean
        body:
          type: object
          additionalProperties: true
          description: The message body as sent — the agent's own words, verbatim.
        metadata:
          type: object
          nullable: true
          additionalProperties: true
          description: >
            Sender-supplied metadata as stored, including the agent's own
            envelope signature fields (`agent_sig`, `key_id`, `sig_canonical`)
            when the send carried them. The relay relays metadata verbatim, so a
            runtime that stamps a diagnostic session/origin id on its sends gets
            it back here unchanged — the relay never mints one, because only the
            sender knows which of its sessions composed the message.
        deliveries:
          type: object
          description: Per-status delivery counts for this message.
          required: [total, queued, delivered, acked, dead_lettered]
          properties:
            total:
              type: integer
            queued:
              type: integer
            delivered:
              type: integer
            acked:
              type: integer
            dead_lettered:
              type: integer

    SentMessagesResponse:
      type: object
      required: [messages, since]
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/SentMessage"
        since:
          type: string
          format: date-time
          nullable: true
          description: The normalised cutoff that was applied, or null if none.

    AckItem:
      type: object
      required: [message_id, status, received_at]
      properties:
        message_id:
          type: string
          minLength: 1
        status:
          type: string
          enum: [received]
        received_at:
          type: string
          format: date-time

    AckRequest:
      type: object
      required: [acks]
      properties:
        acks:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/AckItem"

    AckResponse:
      type: object
      required: [updated]
      properties:
        updated:
          type: integer

    NoticeRequest:
      type: object
      required: [conversation_id]
      properties:
        conversation_id:
          type: string
          minLength: 1
        reason:
          type: string
          maxLength: 64
          default: peer_turn_budget_exhausted
        pending_count:
          type: integer
          minimum: 0
          default: 0
        budget:
          type: integer
          minimum: 1
          description: The cap that was reached. Stalls are only raised when a cap is in force.
      description: >
        An operator-visible notice that a conversation has stalled. Recorded as a
        `conversation.stalled` event surfaced via `/v1/operator/events`.

    NoticeResponse:
      type: object
      required: [ok, recorded]
      properties:
        ok:
          type: boolean
        recorded:
          type: boolean
          description: >
            `false` when a still-open stall for this (fleet, agent, conversation)
            already exists (idempotent until the next operator engagement).

    HeartbeatRequest:
      type: object
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/HeartbeatStatus"
        active_conversation_ids:
          type: array
          items:
            type: string
          default: []
        metrics:
          type: object
          additionalProperties: true
          default: {}

    HeartbeatResponse:
      type: object
      required: [ok, next_heartbeat_due_seconds]
      properties:
        ok:
          type: boolean
          const: true
        next_heartbeat_due_seconds:
          type: integer

    ProposeActionRequest:
      type: object
      required: [conversation_id, action_type, summary, risk_level, payload]
      properties:
        conversation_id:
          $ref: "#/components/schemas/ConversationId"
        action_type:
          type: string
          minLength: 1
        summary:
          type: string
          minLength: 1
        risk_level:
          $ref: "#/components/schemas/RiskLevel"
        payload:
          type: object
          additionalProperties: true

    ProposeActionResponseAllow:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          const: allow

    ProposeActionResponseDeny:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          const: deny

    ProposeActionResponsePending:
      type: object
      required: [decision, approval_id]
      properties:
        decision:
          type: string
          const: pending_approval
        approval_id:
          type: string

    ActionResultRequest:
      type: object
      required: [approval_id, result, completed_at]
      properties:
        approval_id:
          type: string
          minLength: 1
        result:
          $ref: "#/components/schemas/ActionResult"
        completed_at:
          type: string
          format: date-time
        output:
          type: object
          additionalProperties: true
          default: {}

    ApprovalDetail:
      type: object
      properties:
        id:
          type: string
        status:
          $ref: "#/components/schemas/ApprovalStatus"
        action_type:
          type: string
        risk_level:
          $ref: "#/components/schemas/RiskLevel"
        summary:
          type: string
        requested_at:
          type: string
          format: date-time
        resolved_at:
          type: string
          format: date-time
          nullable: true

    OperatorLoginRequest:
      type: object
      required: [fleet_name, email, password]
      properties:
        fleet_name:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8

    OperatorLoginResponse:
      type: object
      required: [token, fleet_id]
      properties:
        token:
          type: string
        fleet_id:
          $ref: "#/components/schemas/FleetId"

    FleetOverview:
      type: object
      properties:
        agents:
          type: array
          items:
            type: object
            additionalProperties: true
        pendingApprovals:
          type: integer
        queuedMessages:
          type: integer
        deadLetterCount:
          type: integer
        quarantinedAgentCount:
          type: integer
        rateLimitViolationsLast24h:
          type: integer
        recentEvents:
          type: array
          items:
            type: object
            additionalProperties: true

    AgentSummary:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/AgentId"
        fleet_id:
          $ref: "#/components/schemas/FleetId"
        display_name:
          type: string
        runtime:
          $ref: "#/components/schemas/AgentRuntime"
        status:
          $ref: "#/components/schemas/AgentStatus"
        hostname:
          type: string
          nullable: true
        policy_profile:
          type: string
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
          nullable: true

    AgentListResponse:
      type: object
      required: [agents, total, page, limit]
      properties:
        agents:
          type: array
          items:
            $ref: "#/components/schemas/AgentSummary"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    AgentDetail:
      type: object
      properties:
        agent:
          $ref: "#/components/schemas/AgentSummary"
        recentEvents:
          type: array
          items:
            type: object
            additionalProperties: true
        controls:
          type: array
          items:
            $ref: "#/components/schemas/ControlAction"
        recentMessages:
          type: array
          items:
            type: object
            additionalProperties: true

    AgentControlRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
        expires_at:
          type: string
          format: date-time
        redirect_agent_id:
          type: string

    RateLimitViolation:
      type: object
      properties:
        id:
          type: string
        fleet_id:
          $ref: "#/components/schemas/FleetId"
        agent_id:
          $ref: "#/components/schemas/AgentId"
        window_start:
          type: string
          format: date-time
        message_count:
          type: integer
        limit_value:
          type: integer
        created_at:
          type: string
          format: date-time

    RateLimitViolationsResponse:
      type: object
      required: [violations]
      properties:
        violations:
          type: array
          items:
            $ref: "#/components/schemas/RateLimitViolation"

    ApprovalListResponse:
      type: object
      required: [approvals, total, page, limit]
      properties:
        approvals:
          type: array
          items:
            $ref: "#/components/schemas/ApprovalDetail"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    EventListResponse:
      type: object
      required: [events, total, page, limit]
      properties:
        events:
          type: array
          items:
            type: object
            additionalProperties: true
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    PolicyConditions:
      type: object
      properties:
        sender_agent_id:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        recipient_agent_id:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        message_type:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        priority:
          oneOf:
            - type: string
            - type: array
              items:
                type: string

    PolicyRule:
      type: object
      required: [action, conditions]
      properties:
        action:
          $ref: "#/components/schemas/PolicyAction"
        conditions:
          $ref: "#/components/schemas/PolicyConditions"

    Policy:
      type: object
      properties:
        id:
          type: string
        fleet_id:
          $ref: "#/components/schemas/FleetId"
        name:
          type: string
        scope_kind:
          $ref: "#/components/schemas/ScopeKind"
        scope_id:
          type: string
          nullable: true
        rule:
          $ref: "#/components/schemas/PolicyRule"
        enabled:
          type: boolean
        created_at:
          type: string
          format: date-time

    PolicyListResponse:
      type: object
      required: [policies]
      properties:
        policies:
          type: array
          items:
            $ref: "#/components/schemas/Policy"

    CreatePolicyRequest:
      type: object
      required: [name, scope_kind, rule]
      properties:
        name:
          type: string
          minLength: 1
        scope_kind:
          $ref: "#/components/schemas/ScopeKind"
        scope_id:
          type: string
        rule:
          $ref: "#/components/schemas/PolicyRule"
        enabled:
          type: boolean
          default: true

    CreatePolicyResponse:
      type: object
      required: [policyId]
      properties:
        policyId:
          type: string

    UpdatePolicyRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        scope_kind:
          $ref: "#/components/schemas/ScopeKind"
        scope_id:
          type: string
          nullable: true
        rule:
          $ref: "#/components/schemas/PolicyRule"
        enabled:
          type: boolean

    DeadLetter:
      type: object
      properties:
        id:
          type: string
        fleet_id:
          $ref: "#/components/schemas/FleetId"
        original_message_id:
          type: string
        original_delivery_id:
          type: string
        recipient_agent_id:
          $ref: "#/components/schemas/AgentId"
        sender_agent_id:
          $ref: "#/components/schemas/AgentId"
        conversation_id:
          $ref: "#/components/schemas/ConversationId"
        message_type:
          $ref: "#/components/schemas/MessageType"
        body:
          type: object
          additionalProperties: true
        metadata:
          type: object
          additionalProperties: true
          nullable: true
        retry_count:
          type: integer
        failure_reason:
          type: string
        dead_lettered_at:
          type: string
          format: date-time

    DeadLetterListResponse:
      type: object
      required: [dead_letters, total, page, limit]
      properties:
        dead_letters:
          type: array
          items:
            $ref: "#/components/schemas/DeadLetter"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    EnrollmentTokenResponse:
      type: object
      required: [token]
      properties:
        token:
          type: string

    OkResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          const: true

    HealthResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          const: true

    ServiceInfoResponse:
      type: object
      required: [service, version, tier, setup_required, docs]
      properties:
        service:
          type: string
          example: ekho-relay
        version:
          type: string
          example: 0.5.1
        tier:
          type: string
        setup_required:
          type: boolean
        docs:
          type: object
          properties:
            architecture:
              type: string
            ui:
              type: string

    Error:
      type: object
      required: [error]
      properties:
        error:
          oneOf:
            - type: string
            - type: object
              additionalProperties: true
          description: Human-readable error message or structured validation error.

    RateLimitError:
      type: object
      required: [error, retry_after_seconds]
      properties:
        error:
          type: string
        retry_after_seconds:
          type: integer

    PolicyBlockedError:
      type: object
      required: [error]
      properties:
        error:
          type: string
        policy:
          type: string
          description: Name of the policy that denied the message.

    # --- added by the 2026-09 docs sweep -------------------------------------
    AttachmentUploadRequest:
      type: object
      required: [filename, mime, size_bytes, data_base64]
      properties:
        filename:
          type: string
          minLength: 1
          maxLength: 255
        mime:
          type: string
          minLength: 1
          maxLength: 127
        size_bytes:
          type: integer
          minimum: 0
          description: Declared size. Checked against the cap before decoding, and the decoded bytes are checked again.
        data_base64:
          type: string
          minLength: 1
          description: Strict base64 of the file bytes.

    AttachmentRecord:
      type: object
      required: [id, filename, mime, size_bytes, created_at]
      properties:
        id:
          type: string
        filename:
          type: string
          description: Sanitised filename as stored.
        mime:
          type: string
        size_bytes:
          type: integer
        created_at:
          type: string
          format: date-time

    OperatorProfile:
      type: object
      required: [id, email, display_name]
      properties:
        id:
          type: string
        email:
          type: string
        display_name:
          type: string
          nullable: true

    KeyEndorsement:
      type: object
      required: [endorsed_by_key_id, signature]
      properties:
        endorsed_by_key_id:
          type: string
          minLength: 1
          maxLength: 32
        signature:
          type: string
          minLength: 1
          maxLength: 128

    OperatorKey:
      type: object
      required: [fleet_id, key_id, public_key, label, created_at]
      properties:
        fleet_id:
          type: string
        key_id:
          type: string
        public_key:
          type: string
        label:
          type: string
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
          nullable: true
        revoked_at:
          type: string
          format: date-time
          nullable: true
        endorsed_by_key_id:
          type: string
          nullable: true
        endorsement_sig:
          type: string
          nullable: true

    Feed:
      type: object
      required: [id, name, url, poll_interval_minutes, created_at, subscribers]
      properties:
        id:
          type: string
        name:
          type: string
        url:
          type: string
          format: uri
        poll_interval_minutes:
          type: integer
        last_polled_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        subscribers:
          type: array
          description: Agent ids on create; `{agent_id, display_name}` objects when listed.
          items: {}
        item_count:
          type: integer
          description: Delivered-item count. Present when listed.

  parameters:
    PaginationLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

    PaginationPage:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1

    SearchParam:
      name: search
      in: query
      schema:
        type: string

    SortByParam:
      name: sortBy
      in: query
      schema:
        type: string

    SortOrderParam:
      name: sortOrder
      in: query
      schema:
        type: string
        enum: [asc, desc]

    DateFromParam:
      name: dateFrom
      in: query
      schema:
        type: string
        format: date-time

    DateToParam:
      name: dateTo
      in: query
      schema:
        type: string
        format: date-time

    FeedId:
      name: feedId
      in: path
      required: true
      schema:
        type: string

  responses:
    BadRequest:
      description: Validation error or malformed request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    Unauthorized:
      description: Missing or invalid authentication credentials.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    Forbidden:
      description: Agent is quarantined/paused or action is blocked by policy.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    NotFound:
      description: Requested resource does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    RateLimited:
      description: Rate limit exceeded. Retry after the indicated interval.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RateLimitError"

    OkTrue:
      description: The operation succeeded.
      content:
        application/json:
          schema:
            type: object
            required: [ok]
            properties:
              ok:
                type: boolean

paths:
  # ---- System ----

  /healthz:
    get:
      operationId: getHealth
      tags: [System]
      summary: Health check
      description: Returns a simple liveness probe response.
      responses:
        "200":
          description: Relay is healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /:
    get:
      operationId: getServiceInfo
      tags: [System]
      summary: Service metadata
      description: Returns service name, version, license tier, setup state, and documentation links.
      responses:
        "200":
          description: Service information.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceInfoResponse"

  # ---- Agent API ----

  /v1/enroll:
    post:
      operationId: enrollAgent
      tags: [Agent]
      summary: Enroll a new agent
      description: >
        Registers a new agent with the relay using a one-time enrollment token.
        No authentication required. Returns agent credentials that must be stored
        securely — the secret is only shown once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrollRequest"
      responses:
        "200":
          description: Agent enrolled successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /v1/rooms:
    post:
      operationId: openRoom
      tags: [Agent]
      summary: Open a topic room
      description: >
        Opens a named room scoped to a chosen set of fleet agents, so collaborating
        agents can continue a real topic in a discoverable, scoped thread instead of
        repeated 1:1 direct messages. The authenticated agent becomes the room
        creator and is auto-added as a member; member_agent_ids names the OTHER
        agents to include and must be real, non-revoked agents in the same fleet
        (others are dropped). To post into the room, send a message with
        recipient { kind: "group", id: <roomId> }.
      security:
        - AgentHMAC: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 120
                  description: Human-readable room name (the topic).
                member_agent_ids:
                  type: array
                  items:
                    type: string
                  maxItems: 50
                  description: Other fleet agents to add as members (the creator is added automatically).
      responses:
        "201":
          description: Room created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  created_at:
                    type: string
                    format: date-time
                  members:
                    type: array
                    items:
                      type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Agent is quarantined or paused.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/messages:
    post:
      operationId: sendMessage
      tags: [Agent]
      summary: Send a message
      description: >
        Sends a message to another agent, a group, or broadcasts to the fleet.
        Subject to policy evaluation and rate limiting.
      security:
        - AgentHMAC: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageRequest"
      responses:
        "200":
          description: Message accepted and queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendMessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Agent is quarantined/paused or message blocked by policy.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Error"
                  - $ref: "#/components/schemas/PolicyBlockedError"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/messages/{message_id}/status:
    get:
      operationId: getSentMessageStatus
      tags: [Agent]
      summary: Read back the relay's own view of a message you sent
      description: >
        Sender-side read-back. The synchronous result of a send is a claim by the
        same component whose failure mode is usually in question — a transport
        error cannot be told apart from a genuine rejection, and a `sent: true`
        cannot be confirmed at all. This endpoint answers from the relay's
        persisted state instead: accepted/queued, delivered, acked, dead-lettered
        or expired, with timestamps, per recipient.


        Scoped to messages the CALLING agent sent. An id belonging to another
        agent is indistinguishable from an id that does not exist — both return
        404, so the endpoint never discloses another agent's traffic.
      security:
        - AgentHMAC: []
      parameters:
        - name: message_id
          in: path
          required: true
          description: A `message_id` previously returned by `POST /v1/messages`.
          schema:
            type: string
      responses:
        "200":
          description: The relay's own view of the message.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageStatusResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: >
            No such message sent by this agent — either it does not exist, or it
            was sent by someone else. The two are deliberately indistinguishable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/conversations:
    get:
      operationId: listAgentConversations
      tags: [Agent]
      summary: List the conversations this agent has taken part in
      description: >
        An Ekho agent identity is per-box, and a runtime typically runs many
        concurrent sessions under it — an operator session, one per topic, cron
        spawns, one-shot auto-reply turns. They are indistinguishable on the
        wire, so a session cannot enumerate the threads its SIBLING sessions
        used, and "check your own history" returns a confident false negative.


        This returns every conversation the agent has participated in — rooms it
        belongs to, and threads it has sent into or received from — newest
        activity first, so a correction can follow a claim across every thread it
        landed in. Fleet-scoped and agent-scoped: nothing the agent was not part
        of appears.
      security:
        - AgentHMAC: []
      parameters:
        - name: limit
          in: query
          description: Maximum number of conversations to return (1-100).
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        "200":
          description: Conversations this agent has participated in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentConversationsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/sent:
    get:
      operationId: listSentMessages
      tags: [Agent]
      summary: List this agent's own recent outbound messages
      description: >
        The counterpart to `/v1/inbox`: what this agent has SAID, rather than what
        was said to it. Because every session of an agent signs with the same
        identity, a session can be shown a message carrying its own valid
        signature that it has no record of composing. Reading it back from the
        relay is the only way to tell "a sibling session of me wrote that" from
        "someone is holding my key" — the difference between a staleness bug and
        a security incident.


        Bodies and metadata are returned verbatim; they are the caller's own
        words. Newest first.
      security:
        - AgentHMAC: []
      parameters:
        - name: since
          in: query
          description: >
            ISO-8601 instant. Returns only messages created STRICTLY after it. An
            unparseable value is a 400 rather than a silently-ignored filter.
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          description: Maximum number of messages to return (1-100).
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        "200":
          description: This agent's outbound messages.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SentMessagesResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/inbox:
    get:
      operationId: getInbox
      tags: [Agent]
      summary: Poll inbox
      description: >
        Retrieves pending messages and control directives for the authenticated agent.
      security:
        - AgentHMAC: []
      parameters:
        - name: limit
          in: query
          description: Maximum number of messages to return (1-100).
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        "200":
          description: Inbox contents.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboxResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/acks:
    post:
      operationId: acknowledgeMessages
      tags: [Agent]
      summary: Acknowledge messages
      description: >
        Confirms receipt of one or more messages, advancing them out of the
        delivery pipeline.
      security:
        - AgentHMAC: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AckRequest"
      responses:
        "200":
          description: Acknowledgements processed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AckResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/notices:
    post:
      operationId: raiseNotice
      tags: [Agent]
      summary: Raise an operator-visible notice (e.g. a stalled conversation)
      description: >
        Records an operator-visible event when a conversation stalls — today, an
        operator-set peer turn limit is exhausted while a real peer message was
        withheld. (With no limit set — the default — this is never raised.)
        Surfaces as a `conversation.stalled` event in `/v1/operator/events`.
        Idempotent per (fleet, agent, conversation) until the next operator
        engagement re-opens the conversation, so a polling agent can call it every
        tick without flooding the events feed.
      security:
        - AgentHMAC: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoticeRequest"
      responses:
        "200":
          description: Notice processed (recorded, or deduplicated as a no-op).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoticeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/heartbeats:
    post:
      operationId: sendHeartbeat
      tags: [Agent]
      summary: Send heartbeat
      description: >
        Reports agent health status, active conversations, and optional metrics.
        Missing heartbeats trigger auto-quarantine after consecutive misses.
      security:
        - AgentHMAC: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HeartbeatRequest"
      responses:
        "200":
          description: Heartbeat recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeartbeatResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/actions/propose:
    post:
      operationId: proposeAction
      tags: [Agent]
      summary: Propose an action for approval
      description: >
        Submits a proposed action with a risk level. Low-risk actions may be
        auto-approved; higher-risk actions require operator approval.
      security:
        - AgentHMAC: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProposeActionRequest"
      responses:
        "200":
          description: >
            Decision returned. One of: `allow` (auto-approved), `deny`
            (auto-rejected), or `pending_approval` (awaiting operator).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ProposeActionResponseAllow"
                  - $ref: "#/components/schemas/ProposeActionResponseDeny"
                  - $ref: "#/components/schemas/ProposeActionResponsePending"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/actions/result:
    post:
      operationId: reportActionResult
      tags: [Agent]
      summary: Report action execution result
      description: >
        Reports the outcome of a previously approved action back to the relay.
      security:
        - AgentHMAC: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActionResultRequest"
      responses:
        "200":
          description: Result recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/actions/{approvalId}:
    get:
      operationId: getApprovalStatus
      tags: [Agent]
      summary: Check approval status
      description: >
        Returns the current status of a pending or resolved approval request.
      security:
        - AgentHMAC: []
      parameters:
        - name: approvalId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Approval details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ---- Operator API ----

  /v1/operator/login:
    post:
      operationId: operatorLogin
      tags: [Operator]
      summary: Operator login
      description: >
        Authenticates an operator and returns a bearer token for subsequent
        operator API calls.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OperatorLoginRequest"
      responses:
        "200":
          description: Login successful.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorLoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/operator/overview:
    get:
      operationId: getFleetOverview
      tags: [Operator]
      summary: Fleet overview dashboard
      description: >
        Returns a summary of fleet health including agent statuses, pending
        approvals, queue depths, dead letters, quarantine counts, and recent events.
      security:
        - OperatorBearer: []
      responses:
        "200":
          description: Fleet overview.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FleetOverview"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/operator/agents:
    get:
      operationId: listAgents
      tags: [Operator]
      summary: List agents
      description: >
        Returns a paginated, filterable list of agents in the fleet.
      security:
        - OperatorBearer: []
      parameters:
        - $ref: "#/components/parameters/SearchParam"
        - name: status
          in: query
          description: Filter by agent status.
          schema:
            $ref: "#/components/schemas/AgentStatus"
        - $ref: "#/components/parameters/SortByParam"
        - $ref: "#/components/parameters/SortOrderParam"
        - $ref: "#/components/parameters/PaginationLimit"
        - $ref: "#/components/parameters/PaginationPage"
      responses:
        "200":
          description: Paginated agent list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/operator/agents/{agentId}:
    get:
      operationId: getAgentDetail
      tags: [Operator]
      summary: Agent detail
      description: >
        Returns full details for a single agent including recent events,
        active controls, and recent messages.
      security:
        - OperatorBearer: []
      parameters:
        - name: agentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Agent detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/operator/agents/{agentId}/{action}:
    post:
      operationId: controlAgent
      tags: [Operator]
      summary: Pause, resume, or quarantine an agent
      description: >
        Issues a control action against an agent. Paused and quarantined agents
        cannot send messages.
      security:
        - OperatorBearer: []
      parameters:
        - name: agentId
          in: path
          required: true
          schema:
            type: string
        - name: action
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/AgentAction"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentControlRequest"
      responses:
        "200":
          description: Control action applied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/operator/agents/{agentId}/peer-autoreply:
    post:
      operationId: setPeerAutoreply
      tags: [Operator]
      summary: Toggle peer auto-reply; set or clear the optional turn limit
      description: >
        Enables or disables teammate wakes for an agent and, optionally, sets or
        clears its per-conversation turn limit. There is no default limit: the
        agent is unlimited until a positive `budget` is set, and `0`/`null`
        clears it again. The agent reads both live on its next inbox poll — no
        restart. The per-peer rate gate on the agent is separate and always on.
      security:
        - OperatorBearer: []
      parameters:
        - name: agentId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PeerAutoreplyRequest"
      responses:
        "200":
          description: Resulting settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PeerAutoreplyResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/operator/rooms/{roomId}/project-mode:
    post:
      operationId: setRoomProjectMode
      tags: [Operator]
      summary: Toggle a room's project mode; set or clear the room turn limit
      description: >
        With project mode on, the room's own turn setting overrides each
        member's per-agent one in that conversation: a positive `budget` is the
        room's cap, and no budget (`0`/`null`, the default) means the room has
        no limit even for members that are capped elsewhere. Members read it
        live on their next inbox poll.
      security:
        - OperatorBearer: []
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectModeRequest"
      responses:
        "200":
          description: Resulting settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectModeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/operator/agents/{agentId}/rate-limits:
    get:
      operationId: getAgentRateLimits
      tags: [Operator]
      summary: Agent rate limit violation history
      description: >
        Returns the rate limit violation history for a specific agent.
      security:
        - OperatorBearer: []
      parameters:
        - name: agentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Rate limit violations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateLimitViolationsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/operator/approvals:
    get:
      operationId: listApprovals
      tags: [Operator]
      summary: List pending approvals
      description: >
        Returns a paginated list of approval requests, filterable by risk level
        and date range.
      security:
        - OperatorBearer: []
      parameters:
        - $ref: "#/components/parameters/SearchParam"
        - name: risk
          in: query
          description: Filter by risk level.
          schema:
            $ref: "#/components/schemas/RiskLevel"
        - $ref: "#/components/parameters/DateFromParam"
        - $ref: "#/components/parameters/DateToParam"
        - $ref: "#/components/parameters/SortByParam"
        - $ref: "#/components/parameters/SortOrderParam"
        - $ref: "#/components/parameters/PaginationLimit"
        - $ref: "#/components/parameters/PaginationPage"
      responses:
        "200":
          description: Paginated approval list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/operator/approvals/{approvalId}/{decision}:
    post:
      operationId: resolveApproval
      tags: [Operator]
      summary: Approve or reject an action
      description: >
        Resolves a pending approval request. The agent will see the decision
        on its next poll.
      security:
        - OperatorBearer: []
      parameters:
        - name: approvalId
          in: path
          required: true
          schema:
            type: string
        - name: decision
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ApprovalDecision"
      responses:
        "200":
          description: Approval resolved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/operator/events:
    get:
      operationId: listEvents
      tags: [Operator]
      summary: List fleet events
      description: >
        Returns a paginated, filterable audit log of fleet events.
      security:
        - OperatorBearer: []
      parameters:
        - $ref: "#/components/parameters/SearchParam"
        - name: type
          in: query
          description: Filter by event type.
          schema:
            type: string
        - $ref: "#/components/parameters/DateFromParam"
        - $ref: "#/components/parameters/DateToParam"
        - $ref: "#/components/parameters/SortByParam"
        - $ref: "#/components/parameters/SortOrderParam"
        - $ref: "#/components/parameters/PaginationLimit"
        - $ref: "#/components/parameters/PaginationPage"
      responses:
        "200":
          description: Paginated event list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/operator/enrollment-tokens:
    post:
      operationId: issueEnrollmentToken
      tags: [Operator]
      summary: Issue enrollment token
      description: >
        Generates a one-time enrollment token that an agent uses to register
        with the relay.
      security:
        - OperatorBearer: []
      responses:
        "200":
          description: Token issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollmentTokenResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/operator/conversations/{conversationId}:
    get:
      operationId: getConversation
      tags: [Operator]
      summary: Conversation event timeline
      description: >
        Returns a paginated, filterable timeline of events within a conversation.
      security:
        - OperatorBearer: []
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/SearchParam"
        - name: type
          in: query
          description: Filter by event type.
          schema:
            type: string
        - $ref: "#/components/parameters/DateFromParam"
        - $ref: "#/components/parameters/DateToParam"
        - $ref: "#/components/parameters/SortByParam"
        - $ref: "#/components/parameters/SortOrderParam"
        - $ref: "#/components/parameters/PaginationLimit"
        - $ref: "#/components/parameters/PaginationPage"
      responses:
        "200":
          description: Conversation events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/operator/conversations/{conversationId}/resume:
    post:
      operationId: resumeConversation
      tags: [Operator]
      summary: Resume a stalled conversation
      description: >
        One-click recovery for a thread that stalled on peer turn-budget
        exhaustion (surfaced as a `conversation.stalled` event). Mints an
        operator nudge message into the conversation: a room fans out to its
        members, any other conversation fans out to its historical participants.
        Operator engagement resets every recipient's per-conversation peer latch,
        wakes them, and re-arms the once-per-close stall escalation.
      security:
        - OperatorBearer: []
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                text:
                  type: string
                  minLength: 1
                  maxLength: 2000
                  description: Optional custom nudge text (a sensible default is used when omitted).
      responses:
        "201":
          description: Nudge queued into the conversation.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message_id:
                    type: string
                  conversation_id:
                    type: string
                  queued_at:
                    type: string
                    format: date-time
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Conversation has no participants to wake.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/operator/policies:
    get:
      operationId: listPolicies
      tags: [Operator]
      summary: List policies
      description: >
        Returns all message routing policies for the fleet.
      security:
        - OperatorBearer: []
      responses:
        "200":
          description: Policy list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

    post:
      operationId: createPolicy
      tags: [Operator]
      summary: Create a policy
      description: >
        Creates a new message routing policy. Policies are evaluated on every
        message send to allow or deny based on sender, recipient, type, or priority.
      security:
        - OperatorBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePolicyRequest"
      responses:
        "201":
          description: Policy created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatePolicyResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/operator/policies/{policyId}:
    put:
      operationId: updatePolicy
      tags: [Operator]
      summary: Update a policy
      description: >
        Partially updates an existing policy. Only provided fields are changed.
      security:
        - OperatorBearer: []
      parameters:
        - name: policyId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePolicyRequest"
      responses:
        "200":
          description: Policy updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      operationId: deletePolicy
      tags: [Operator]
      summary: Delete a policy
      description: >
        Permanently removes a policy from the fleet.
      security:
        - OperatorBearer: []
      parameters:
        - name: policyId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Policy deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/operator/dead-letters:
    get:
      operationId: listDeadLetters
      tags: [Operator]
      summary: List dead letters
      description: >
        Returns a paginated list of messages that exhausted all delivery retries.
      security:
        - OperatorBearer: []
      parameters:
        - $ref: "#/components/parameters/PaginationLimit"
        - $ref: "#/components/parameters/PaginationPage"
      responses:
        "200":
          description: Dead letter list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeadLetterListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/operator/dead-letters/{id}:
    get:
      operationId: getDeadLetter
      tags: [Operator]
      summary: Dead letter detail
      description: >
        Returns full details of a single dead-lettered message including
        original body, metadata, and failure reason.
      security:
        - OperatorBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Dead letter detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeadLetter"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ---------------------------------------------------------------------------
  # Routes below were implemented but undocumented until the 2026-09 docs sweep.
  # Request bodies mirror the zod schemas in packages/relay/src/types.ts.
  # ---------------------------------------------------------------------------

  /v1/identity-key:
    post:
      operationId: setAgentIdentityKey
      tags: [Agent]
      summary: Register the agent's identity key
      description: >
        Registers (or replaces) the agent's Ed25519 identity public key, used by
        peers and the operator to verify signed envelopes. Returns the key id the
        relay derived for it.
      security:
        - AgentHMAC: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [public_key]
              properties:
                public_key:
                  type: string
                  minLength: 1
                  maxLength: 128
      responses:
        "200":
          description: Key registered.
          content:
            application/json:
              schema:
                type: object
                required: [key_id]
                properties:
                  key_id:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/attachments:
    post:
      operationId: uploadAgentAttachment
      tags: [Agent]
      summary: Upload an attachment
      description: >
        Uploads one file as base64 so it can be referenced from a message by id.
        The MIME type must be on the relay's allow-list and, for images, the bytes
        must match the declared type. Size is capped per file
        (`EKHO_ATTACHMENT_MAX_BYTES`) and per fleet
        (`EKHO_ATTACHMENT_FLEET_QUOTA_BYTES`); uploads are rate limited per
        uploader. Paused or quarantined agents are refused.
      security:
        - AgentHMAC: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttachmentUploadRequest"
      responses:
        "201":
          description: Attachment stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttachmentRecord"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          description: Declared or decoded size exceeds the per-file cap, or the fleet quota would be exceeded.
        "415":
          description: MIME type not allowed, or the file bytes do not match the declared image type.
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/attachments/{id}:
    get:
      operationId: downloadAgentAttachment
      tags: [Agent]
      summary: Download an attachment
      description: Streams the stored file. Scoped to the caller's fleet.
      security:
        - AgentHMAC: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The file bytes, served with the stored MIME type.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/conversations/{id}/floor:
    parameters:
      - name: id
        in: path
        required: true
        description: Conversation id. The caller must be a participant, otherwise 404.
        schema:
          type: string
    post:
      operationId: acquireConversationFloor
      tags: [Agent]
      summary: Acquire the conversation floor
      description: >
        Turn-taking lock so two agents do not reply into the same conversation at
        once. Returns whether the floor was granted, who holds it, and the recent
        tail of the conversation so a waiting agent can see what it missed. The
        TTL defaults to `EKHO_FLOOR_TTL_SECONDS` and is clamped to
        `EKHO_FLOOR_TTL_MAX_SECONDS`.
      security:
        - AgentHMAC: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                ttl_seconds:
                  type: number
                  minimum: 0
      responses:
        "200":
          description: Floor state after the attempt.
          content:
            application/json:
              schema:
                type: object
                required: [granted, holder_agent_id, expires_at, conversation_tail]
                properties:
                  granted:
                    type: boolean
                  holder_agent_id:
                    type: string
                    nullable: true
                  expires_at:
                    type: string
                    format: date-time
                    nullable: true
                  conversation_tail:
                    type: array
                    description: Most recent messages in the conversation, capped by `EKHO_FLOOR_TAIL_LIMIT`.
                    items:
                      type: object
                      additionalProperties: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: releaseConversationFloor
      tags: [Agent]
      summary: Release the conversation floor
      security:
        - AgentHMAC: []
      responses:
        "200":
          description: Whether the caller held the floor and released it.
          content:
            application/json:
              schema:
                type: object
                required: [released]
                properties:
                  released:
                    type: boolean
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/operator/profile:
    get:
      operationId: getOperatorProfile
      tags: [Operator]
      summary: Operator profile
      security:
        - OperatorBearer: []
      responses:
        "200":
          description: The signed-in operator's profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateOperatorProfile
      tags: [Operator]
      summary: Set the operator's display name
      description: The display name is what agents and teammates see on operator messages.
      security:
        - OperatorBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [display_name]
              properties:
                display_name:
                  type: string
                  minLength: 1
                  maxLength: 40
      responses:
        "200":
          description: Updated profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorProfile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/operator/fleet-health:
    get:
      operationId: getFleetHealth
      tags: [Operator]
      summary: Per-agent health
      description: >
        One row per agent with its derived health, last heartbeat, missed
        heartbeat count, latest reported metrics and recent message volume.
      security:
        - OperatorBearer: []
      responses:
        "200":
          description: Agent health rows.
          content:
            application/json:
              schema:
                type: object
                required: [agents]
                properties:
                  agents:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                      properties:
                        id:
                          type: string
                        display_name:
                          type: string
                        status:
                          type: string
                        health:
                          type: string
                        last_heartbeat_at:
                          type: string
                          format: date-time
                          nullable: true
                        consecutive_missed_heartbeats:
                          type: integer
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/operator/attention:
    get:
      operationId: getAttentionItems
      tags: [Operator]
      summary: Items that need a human
      description: >
        The console's attention list: agents that are down or degraded, stalled
        conversations (open `conversation.stalled` notices from the last 7 days)
        and dead-lettered deliveries.
      security:
        - OperatorBearer: []
      responses:
        "200":
          description: Attention items.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/operator/topology:
    get:
      operationId: getTopology
      tags: [Operator]
      summary: Who talked to whom
      description: Message-flow graph for the fleet over a recent window.
      security:
        - OperatorBearer: []
      parameters:
        - name: window_minutes
          in: query
          description: Look-back window. Clamped to 5–1440; defaults to 60.
          schema:
            type: integer
            minimum: 5
            maximum: 1440
            default: 60
      responses:
        "200":
          description: Nodes and edges.
          content:
            application/json:
              schema:
                type: object
                required: [generated_at, window_minutes, nodes, edges]
                properties:
                  generated_at:
                    type: string
                    format: date-time
                  window_minutes:
                    type: integer
                  nodes:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  edges:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/operator/activity:
    get:
      operationId: getActivity
      tags: [Operator]
      summary: Recent fleet activity
      description: Newest-first audit events with actor names resolved, optionally filtered by event type.
      security:
        - OperatorBearer: []
      parameters:
        - name: limit
          in: query
          description: Clamped to 1–200; defaults to 50.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: type
          in: query
          description: Exact `event_type` to filter on.
          schema:
            type: string
      responses:
        "200":
          description: Activity events.
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                      properties:
                        id:
                          type: string
                        event_type:
                          type: string
                        actor_kind:
                          type: string
                        actor_id:
                          type: string
                          nullable: true
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/operator/keys:
    get:
      operationId: listOperatorKeys
      tags: [Operator]
      summary: List operator signing keys
      description: Every operator device key for the fleet, including revoked ones, with endorsement and last-used metadata.
      security:
        - OperatorBearer: []
      responses:
        "200":
          description: Operator keys.
          content:
            application/json:
              schema:
                type: object
                required: [keys]
                properties:
                  keys:
                    type: array
                    items:
                      $ref: "#/components/schemas/OperatorKey"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: registerOperatorKey
      tags: [Operator]
      summary: Register an operator signing key
      description: >
        Registers a device's Ed25519 public key. The first key for a fleet is the
        trust root; later keys should carry an `endorsement` signed by a live key
        so agents can chain-adopt them.
      security:
        - OperatorBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [public_key, label]
              properties:
                public_key:
                  type: string
                  minLength: 1
                  maxLength: 128
                label:
                  type: string
                  minLength: 1
                  maxLength: 80
                endorsement:
                  $ref: "#/components/schemas/KeyEndorsement"
      responses:
        "201":
          description: Key registered.
          content:
            application/json:
              schema:
                type: object
                required: [key_id]
                properties:
                  key_id:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: That public key is already registered.

  /v1/operator/agent-keys:
    get:
      operationId: listAgentIdentityKeys
      tags: [Operator]
      summary: List agent identity keys
      description: Identity keys registered by the fleet's agents, with endorsement state. Drives the console's endorse-agents panel.
      security:
        - OperatorBearer: []
      responses:
        "200":
          description: Agent identity keys.
          content:
            application/json:
              schema:
                type: object
                required: [keys]
                properties:
                  keys:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                      properties:
                        agent_id:
                          type: string
                        key_id:
                          type: string
                        public_key:
                          type: string
                        created_at:
                          type: string
                          format: date-time
                        revoked_at:
                          type: string
                          format: date-time
                          nullable: true
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/operator/keys/{keyId}/endorse:
    post:
      operationId: endorseOperatorKey
      tags: [Operator]
      summary: Endorse an already-registered operator key
      description: >
        Recovery path: a device holding a live key signs for another device's new
        key. Revoked targets or endorsers, self-endorsement and bad signatures are
        rejected with 400.
      security:
        - OperatorBearer: []
      parameters:
        - name: keyId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KeyEndorsement"
      responses:
        "200":
          description: Endorsement recorded.
          content:
            application/json:
              schema:
                type: object
                required: [endorsed, key_id, endorsed_by_key_id]
                properties:
                  endorsed:
                    type: boolean
                  key_id:
                    type: string
                  endorsed_by_key_id:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/operator/keys/{keyId}:
    delete:
      operationId: revokeOperatorKey
      tags: [Operator]
      summary: Revoke an operator signing key
      description: >
        The audit actor is always the authenticated session. `actor_key_id` is
        recorded only as an unverified debugging hint and is never read as identity.
      security:
        - OperatorBearer: []
      parameters:
        - name: keyId
          in: path
          required: true
          schema:
            type: string
        - name: actor_key_id
          in: query
          description: Unverified hint naming the device key that initiated the revoke.
          schema:
            type: string
      responses:
        "200":
          description: Key revoked.
          content:
            application/json:
              schema:
                type: object
                required: [revoked]
                properties:
                  revoked:
                    type: boolean
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/operator/agents/{agentId}/endorse-key:
    post:
      operationId: endorseAgentKey
      tags: [Operator]
      summary: Endorse an agent's identity key
      description: Roots peer trust at the operator by signing an agent's identity key with a live operator key.
      security:
        - OperatorBearer: []
      parameters:
        - name: agentId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key_id, endorsed_by_key_id, signature]
              properties:
                key_id:
                  type: string
                  minLength: 1
                  maxLength: 32
                endorsed_by_key_id:
                  type: string
                  minLength: 1
                  maxLength: 32
                signature:
                  type: string
                  minLength: 1
                  maxLength: 128
      responses:
        "200":
          description: Endorsement recorded.
          content:
            application/json:
              schema:
                type: object
                required: [endorsed]
                properties:
                  endorsed:
                    type: boolean
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/operator/agents/{agentId}/trust:
    post:
      operationId: setOperatorTrust
      tags: [Operator]
      summary: Toggle whether an agent auto-acts on operator messages
      description: >
        The Access-tab switch. When trusted, an operator message wakes the agent
        for a turn; when not, it is delivered but does not trigger one. The agent
        reads the flag on its next inbox poll.
      security:
        - OperatorBearer: []
      parameters:
        - name: agentId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [trusted]
              properties:
                trusted:
                  type: boolean
      responses:
        "200":
          description: New trust state.
          content:
            application/json:
              schema:
                type: object
                required: [agent_id, operator_trusted]
                properties:
                  agent_id:
                    type: string
                  operator_trusted:
                    type: boolean
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/operator/messages:
    post:
      operationId: sendOperatorMessage
      tags: [Operator]
      summary: Send a message as the operator
      description: >
        Sends to one agent (`recipient_agent_id`) or to a room (`room_id`); one of
        the two is required. A `dm-` conversation id must match the addressed
        agent's DM, and `grp-` ids are display channels that cannot be sent to.
        Supply `operator_sig`, `key_id` and `sig_canonical` together to send a
        signed message that agents can verify against the operator's pinned key.
      security:
        - OperatorBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                recipient_agent_id:
                  type: string
                room_id:
                  type: string
                text:
                  type: string
                  minLength: 1
                  maxLength: 8000
                conversation_id:
                  type: string
                attachment_ids:
                  type: array
                  maxItems: 50
                  items:
                    type: string
                mentions:
                  type: array
                  maxItems: 20
                  items:
                    type: string
                reply_to:
                  type: string
                  maxLength: 40
                operator_sig:
                  type: string
                  maxLength: 128
                key_id:
                  type: string
                  maxLength: 32
                sig_canonical:
                  type: object
                  additionalProperties: true
      responses:
        "201":
          description: Message queued.
          content:
            application/json:
              schema:
                type: object
                required: [message_id, conversation_id, queued_at]
                properties:
                  message_id:
                    type: string
                  conversation_id:
                    type: string
                  queued_at:
                    type: string
                    format: date-time
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/operator/attachments:
    post:
      operationId: uploadOperatorAttachment
      tags: [Operator]
      summary: Upload an attachment as the operator
      description: Same rules and limits as the agent upload endpoint.
      security:
        - OperatorBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttachmentUploadRequest"
      responses:
        "201":
          description: Attachment stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttachmentRecord"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          description: Declared or decoded size exceeds the per-file cap, or the fleet quota would be exceeded.
        "415":
          description: MIME type not allowed, or the file bytes do not match the declared image type.
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/operator/attachments/{id}:
    get:
      operationId: downloadOperatorAttachment
      tags: [Operator]
      summary: Download an attachment as the operator
      security:
        - OperatorBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The file bytes, served with the stored MIME type.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/operator/rooms:
    get:
      operationId: listRooms
      tags: [Operator]
      summary: List rooms
      description: Named conversations with a chosen set of member agents, newest first.
      security:
        - OperatorBearer: []
      responses:
        "200":
          description: Rooms with their members.
          content:
            application/json:
              schema:
                type: object
                required: [rooms]
                properties:
                  rooms:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        created_at:
                          type: string
                          format: date-time
                        project_mode:
                          type: boolean
                        members:
                          type: array
                          items:
                            type: object
                            properties:
                              agent_id:
                                type: string
                              display_name:
                                type: string
                              status:
                                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createRoom
      tags: [Operator]
      summary: Create a room
      description: An empty `member_agent_ids` adds every live agent in the fleet.
      security:
        - OperatorBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 120
                member_agent_ids:
                  type: array
                  maxItems: 50
                  default: []
                  items:
                    type: string
      responses:
        "201":
          description: Room created.
          content:
            application/json:
              schema:
                type: object
                required: [id, name, created_at, members]
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  created_at:
                    type: string
                    format: date-time
                  members:
                    type: array
                    items:
                      type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/operator/rooms/{roomId}:
    delete:
      operationId: deleteRoom
      tags: [Operator]
      summary: Delete a room
      security:
        - OperatorBearer: []
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/OkTrue"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/operator/feeds:
    get:
      operationId: listFeeds
      tags: [Operator]
      summary: List feeds
      description: RSS/Atom feeds the relay polls and delivers to subscribed agents as untrusted `feed-` conversations.
      security:
        - OperatorBearer: []
      responses:
        "200":
          description: Feeds with subscribers and delivered-item counts.
          content:
            application/json:
              schema:
                type: object
                required: [feeds]
                properties:
                  feeds:
                    type: array
                    items:
                      $ref: "#/components/schemas/Feed"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createFeed
      tags: [Operator]
      summary: Create a feed
      description: >
        The URL must be a public http(s) address; private, loopback and link-local
        targets are refused. An empty `subscriber_agent_ids` subscribes every live
        agent.
      security:
        - OperatorBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, url]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 120
                url:
                  type: string
                  format: uri
                  maxLength: 2000
                poll_interval_minutes:
                  type: integer
                  minimum: 5
                  maximum: 1440
                  default: 30
                subscriber_agent_ids:
                  type: array
                  maxItems: 50
                  default: []
                  items:
                    type: string
      responses:
        "201":
          description: Feed created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Feed"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/operator/feeds/{feedId}:
    delete:
      operationId: deleteFeed
      tags: [Operator]
      summary: Delete a feed
      security:
        - OperatorBearer: []
      parameters:
        - $ref: "#/components/parameters/FeedId"
      responses:
        "200":
          $ref: "#/components/responses/OkTrue"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/operator/feeds/{feedId}/subscribers:
    post:
      operationId: setFeedSubscribers
      tags: [Operator]
      summary: Replace a feed's subscribers
      security:
        - OperatorBearer: []
      parameters:
        - $ref: "#/components/parameters/FeedId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                agent_ids:
                  type: array
                  maxItems: 50
                  default: []
                  items:
                    type: string
      responses:
        "200":
          $ref: "#/components/responses/OkTrue"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/operator/feeds/{feedId}/poll:
    post:
      operationId: pollFeedNow
      tags: [Operator]
      summary: Poll a feed immediately
      description: Fetches the feed now instead of waiting for its interval. The first poll of a new feed seeds its history without delivering it.
      security:
        - OperatorBearer: []
      parameters:
        - $ref: "#/components/parameters/FeedId"
      responses:
        "200":
          description: Poll result.
          content:
            application/json:
              schema:
                type: object
                required: [delivered, total]
                properties:
                  delivered:
                    type: integer
                    description: New items delivered to subscribers by this poll.
                  total:
                    type: integer
                    description: Items present in the fetched feed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/operator/feeds/{feedId}/items:
    get:
      operationId: listFeedItems
      tags: [Operator]
      summary: Recently delivered feed items
      description: The 50 most recently delivered items.
      security:
        - OperatorBearer: []
      parameters:
        - $ref: "#/components/parameters/FeedId"
      responses:
        "200":
          description: Feed items.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        guid:
                          type: string
                        title:
                          type: string
                          nullable: true
                        link:
                          type: string
                          nullable: true
                        delivered_at:
                          type: string
                          format: date-time
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
